name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK; only the platform the app compiles against is
      # ensured here.
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew test --console=plain

      # A preview build: its own package id and key, so it installs beside the real app.
      - name: Release APK (preview)
        run: ./gradlew assembleRelease -Pforge.preview --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: Forge-preview
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
